<div class="ui-data-table__wrapper">
  <table [ngClass]="tableClasses">
    <!-- Header -->
    <thead class="ui-data-table__head">
      <tr>
        <!-- Selection checkbox -->
        <th *ngIf="selectable" class="ui-data-table__cell ui-data-table__cell--checkbox">
          <ui-checkbox
            [checked]="allSelected()"
            [indeterminate]="someSelected()"
            (checkboxChange)="toggleAllSelection()"
          ></ui-checkbox>
        </th>

        <!-- Column headers -->
        <th
          *ngFor="let column of columns; trackBy: trackByColumn"
          class="ui-data-table__cell ui-data-table__cell--header"
          [class.ui-data-table__cell--sortable]="column.sortable"
          [style.width]="column.width"
          [style.textAlign]="column.align || 'left'"
          (click)="onHeaderClick(column)"
        >
          <div class="ui-data-table__header-content">
            <!-- Custom header template -->
            <ng-container *ngIf="column.headerTemplate">
              <ng-container *ngTemplateOutlet="column.headerTemplate; context: { $implicit: column }"></ng-container>
            </ng-container>

            <!-- Default header -->
            <span *ngIf="!column.headerTemplate">{{ column.label }}</span>

            <!-- Sort indicator -->
            <span *ngIf="column.sortable" class="ui-data-table__sort-icon">
              <svg *ngIf="getSortIcon(column) === 'none'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" class="ui-data-table__sort-icon--inactive">
                <path d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg *ngIf="getSortIcon(column) === 'asc'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
                <path d="M8 13V3M5 6l3-3 3 3" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg *ngIf="getSortIcon(column) === 'desc'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
                <path d="M8 3v10M5 10l3 3 3-3" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </div>
        </th>

        <!-- Actions column -->
        <th *ngIf="rowActionsTemplate" class="ui-data-table__cell ui-data-table__cell--actions"></th>
      </tr>
    </thead>

    <!-- Loading state -->
    <tbody *ngIf="loading" class="ui-data-table__body">
      <tr *ngFor="let i of getLoadingRows(); trackBy: trackByIndex" class="ui-data-table__row">
        <td *ngIf="selectable" class="ui-data-table__cell">
          <ui-shimmer width="18px" height="18px" borderRadius="4px"></ui-shimmer>
        </td>
        <td *ngFor="let column of columns; trackBy: trackByColumn" class="ui-data-table__cell">
          <ui-shimmer [width]="column.width || '100%'" height="20px"></ui-shimmer>
        </td>
        <td *ngIf="rowActionsTemplate" class="ui-data-table__cell">
          <ui-shimmer width="80px" height="20px"></ui-shimmer>
        </td>
      </tr>
    </tbody>

    <!-- Data rows -->
    <tbody *ngIf="!loading && data.length > 0" class="ui-data-table__body">
      <tr
        *ngFor="let row of data; let i = index; trackBy: trackByIndex"
        class="ui-data-table__row"
        [class.ui-data-table__row--selected]="isRowSelected(row)"
        (click)="onRowClick(row)"
      >
        <!-- Selection checkbox -->
        <td *ngIf="selectable" class="ui-data-table__cell ui-data-table__cell--checkbox">
          <ui-checkbox
            [checked]="isRowSelected(row)"
            (checkboxChange)="toggleRowSelection(row)"
            (click)="$event.stopPropagation()"
          ></ui-checkbox>
        </td>

        <!-- Data cells -->
        <td
          *ngFor="let column of columns; trackBy: trackByColumn"
          class="ui-data-table__cell"
          [style.textAlign]="column.align || 'left'"
        >
          <!-- Custom cell template -->
          <ng-container *ngIf="column.cellTemplate">
            <ng-container *ngTemplateOutlet="column.cellTemplate; context: { $implicit: getCellValue(row, column), row: row, column: column }"></ng-container>
          </ng-container>

          <!-- Default cell -->
          <span *ngIf="!column.cellTemplate">{{ getCellValue(row, column) }}</span>
        </td>

        <!-- Actions cell -->
        <td *ngIf="rowActionsTemplate" class="ui-data-table__cell ui-data-table__cell--actions">
          <ng-container *ngTemplateOutlet="rowActionsTemplate; context: { $implicit: row }"></ng-container>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Empty state -->
  <ui-empty-state
    *ngIf="!loading && data.length === 0"
    [icon]="emptyIcon"
    [title]="emptyTitle"
    [description]="emptyDescription"
    size="md"
  ></ui-empty-state>
</div>

<!-- Pagination -->
<ui-pagination
  *ngIf="paginated && !loading && data.length > 0"
  class="ui-data-table__pagination"
  [totalItems]="totalItems"
  [itemsPerPage]="pageSize"
  [currentPage]="currentPage"
  (pageChange)="onPageChange($event)"
></ui-pagination>
