<div class="offer-banner" *ngIf="pendingOffer">
    <div class="offer-banner__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
    </div>

    <div class="offer-banner__content">
        <h3 class="offer-banner__title">New Offer Received</h3>
        <p class="offer-banner__message">
            Deckard has sent you offer <strong>{{ offerNumber }}</strong>
            with {{ itemCount }} item{{ itemCount !== 1 ? 's' : '' }}
            totalling <strong>&euro; {{ totalAmount | number:'1.2-2' }}</strong>.
            Please review and respond.
        </p>
    </div>

    <div class="offer-banner__actions">
        <button class="offer-banner__btn offer-banner__btn--primary" (click)="onViewOffer()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Review Offer
        </button>
    </div>
</div>
