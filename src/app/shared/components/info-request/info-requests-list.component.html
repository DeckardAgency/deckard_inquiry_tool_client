<div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="info-list">
        <div class="info-list__header">
            <h3 class="info-list__title">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                Information Requests
            </h3>
            <div class="info-list__header-actions">
                <span class="info-list__count" *ngIf="infoRequests.length > 0">
                    {{ infoRequests.length }} {{ infoRequests.length === 1 ? 'Request' : 'Requests' }}
                </span>
                <button class="info-list__close" type="button" (click)="onClose()" aria-label="Close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div class="info-list__loading" *ngIf="loading">
            <div class="info-list__spinner"></div>
            <span>Loading requests...</span>
        </div>

        <!-- Empty State -->
        <div class="info-list__empty" *ngIf="!loading && infoRequests.length === 0">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <p>No information requests at this time</p>
        </div>

        <!-- Requests List -->
        <div class="info-list__items" *ngIf="!loading && infoRequests.length > 0">
            <div class="info-list__item"
                 *ngFor="let request of infoRequests; trackBy: trackByRequestId"
                 [class.info-list__item--urgent]="request.status === 'pending' || request.status === 'needs_revision'">

                <div class="info-list__item-header">
                    <div class="info-list__part-info">
                        <span class="info-list__part-number">{{ getPartInfo(request) }}</span>
                        <span class="info-list__status" [ngClass]="getStatusClass(request)">
                            {{ getStatusLabel(request) }}
                        </span>
                    </div>
                    <span class="info-list__date">{{ formatDate(request.createdAt) }}</span>
                </div>

                <p class="info-list__message" *ngIf="getLastAdminMessage(request)">
                    "{{ getLastAdminMessage(request) }}"
                </p>

                <div class="info-list__actions">
                    <button class="info-list__btn info-list__btn--respond"
                            *ngIf="canRespond(request)"
                            (click)="onRespond(request)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        Respond
                    </button>
                    <button class="info-list__btn info-list__btn--history"
                            (click)="onViewHistory(request)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        View History
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
