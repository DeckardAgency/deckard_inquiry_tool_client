<div class="populator-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="populator">
    <div class="populator__header">
      <div class="populator__title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
        <span>Form Populator</span>
        <span class="populator__badge">DEV</span>
      </div>
      <button class="populator__close" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="populator__body">
      <p class="populator__description">
        Quickly populate the manual entry form with test data. Configure the number of machines and parts below.
      </p>

      <!-- Machine Count -->
      <div class="populator__field">
        <label class="populator__label">Number of Machines</label>
        <div class="populator__input-group">
          <button class="populator__btn-adjust" (click)="machineCount = machineCount - 1; updateMachineCount()" [disabled]="machineCount <= 1">-</button>
          <input type="number" class="populator__input" [(ngModel)]="machineCount" (change)="updateMachineCount()" min="1" max="10">
          <button class="populator__btn-adjust" (click)="machineCount = machineCount + 1; updateMachineCount()" [disabled]="machineCount >= 10">+</button>
        </div>
      </div>

      <!-- Parts per Machine -->
      <div class="populator__machines">
        <div class="populator__machine-wrapper" *ngFor="let count of partsPerMachine; let i = index">
          <div class="populator__machine">
            <label class="populator__machine-label">Machine {{ i + 1 }}</label>
            <div class="populator__input-group populator__input-group--small">
              <button class="populator__btn-adjust populator__btn-adjust--small" (click)="updatePartsCount(i, partsPerMachine[i] - 1)" [disabled]="partsPerMachine[i] <= 1">-</button>
              <input type="number" class="populator__input populator__input--small" [(ngModel)]="partsPerMachine[i]" (change)="updatePartsCount(i, partsPerMachine[i])" min="1" max="20">
              <button class="populator__btn-adjust populator__btn-adjust--small" (click)="updatePartsCount(i, partsPerMachine[i] + 1)" [disabled]="partsPerMachine[i] >= 20">+</button>
            </div>
            <span class="populator__parts-label">parts</span>
          </div>
          <div class="populator__machine-options">
            <label class="populator__checkbox">
              <input type="checkbox" [(ngModel)]="isOtherMachine[i]" (change)="onOtherMachineChange(i)">
              <span class="populator__checkbox-mark"></span>
              <span class="populator__checkbox-label">Other/Older (Not Listed)</span>
            </label>
            <div class="populator__machine-id" *ngIf="isOtherMachine[i]">
              <input type="text" class="populator__input populator__input--full" [(ngModel)]="machineIds[i]" placeholder="Machine ID">
            </div>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="populator__summary">
        <span class="populator__summary-label">Total:</span>
        <span class="populator__summary-value">{{ machineCount }} machine(s), {{ getTotalParts() }} part(s)</span>
      </div>
    </div>

    <div class="populator__footer">
      <button class="populator__btn populator__btn--cancel" (click)="close()">Cancel</button>
      <button class="populator__btn populator__btn--generate" (click)="generateAndPopulate()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        Generate & Populate
      </button>
    </div>

    <div class="populator__hint">
      <span class="populator__shortcut">Cmd+Shift+P</span> to toggle this panel
    </div>
  </div>
</div>
