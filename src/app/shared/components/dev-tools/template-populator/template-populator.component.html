<div class="populator-backdrop" *ngIf="isOpen" (click)="onBackdropClick($event)">
  <div class="populator">
    <div class="populator__header">
      <div class="populator__title">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Template Populator</span>
        <span class="populator__badge">DEV</span>
      </div>
      <button class="populator__close" (click)="close()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="populator__body">
      <p class="populator__description">
        Populate the template spreadsheet with test data. Configure the number of machines and rows (Qty, Part Number, Part Name) below.
      </p>

      <!-- Machine Count -->
      <div class="populator__field">
        <label class="populator__label">Number of Machines</label>
        <div class="populator__input-group">
          <button class="populator__btn-adjust" (click)="machineCount = machineCount - 1; updateMachineCount()" [disabled]="machineCount <= 1">-</button>
          <input type="number" class="populator__input" [(ngModel)]="machineCount" (change)="updateMachineCount()" min="1" max="10">
          <button class="populator__btn-adjust" (click)="machineCount = machineCount + 1; updateMachineCount()" [disabled]="machineCount >= 10">+</button>
        </div>
      </div>

      <!-- Rows per Machine -->
      <div class="populator__machines">
        <div class="populator__machine-wrapper" *ngFor="let count of rowsPerMachine; let i = index">
          <div class="populator__machine">
            <label class="populator__machine-label">Machine {{ i + 1 }}</label>
            <div class="populator__input-group populator__input-group--small">
              <button class="populator__btn-adjust populator__btn-adjust--small" (click)="updateRowCount(i, rowsPerMachine[i] - 1)" [disabled]="rowsPerMachine[i] <= 1">-</button>
              <input type="number" class="populator__input populator__input--small" [(ngModel)]="rowsPerMachine[i]" (change)="updateRowCount(i, rowsPerMachine[i])" min="1" max="50">
              <button class="populator__btn-adjust populator__btn-adjust--small" (click)="updateRowCount(i, rowsPerMachine[i] + 1)" [disabled]="rowsPerMachine[i] >= 50">+</button>
            </div>
            <span class="populator__parts-label">rows</span>
          </div>
          <div class="populator__machine-options">
            <label class="populator__checkbox">
              <input type="checkbox" [(ngModel)]="isOtherMachine[i]" (change)="onOtherMachineChange(i)">
              <span class="populator__checkbox-mark"></span>
              <span class="populator__checkbox-label">Other/Older (Not Listed)</span>
            </label>
            <div class="populator__machine-id" *ngIf="isOtherMachine[i]">
              <input type="text" class="populator__input populator__input--full" [(ngModel)]="machineIds[i]" placeholder="Machine ID">
            </div>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="populator__summary">
        <span class="populator__summary-label">Total:</span>
        <span class="populator__summary-value">{{ machineCount }} machine(s), {{ getTotalRows() }} row(s)</span>
      </div>
    </div>

    <div class="populator__footer">
      <button class="populator__btn populator__btn--cancel" (click)="close()">Cancel</button>
      <button class="populator__btn populator__btn--generate" (click)="generateAndPopulate()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        Generate & Populate
      </button>
    </div>

    <div class="populator__hint">
      <span class="populator__shortcut">Cmd+Shift+P</span> to toggle this panel
    </div>
  </div>
</div>
